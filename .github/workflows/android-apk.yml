name: Build Android APK

permissions:
  contents: write

env:
  AL_RELEASE_VERSION_CODE: 88
  AL_RELEASE_VERSION_NAME: 1.0.88

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/al-tdd
    paths:
      - "android/**"
      - "tavern-app/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run app checks
        run: npm test

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Restore stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/al-release.p12

      - name: Sync bundled web assets
        run: |
          node scripts/generate-yuqi-network-policy.mjs
          npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Run native Android checks
        working-directory: android
        run: |
          set +e
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebugAndroidTest --no-daemon 2>&1 | tee native-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 35 native-check.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Native Android checks failed::$details"
          fi
          exit "$status"

      - name: Build release and compatibility APKs
        working-directory: android
        env:
          AL_VERSION_CODE: ${{ env.AL_RELEASE_VERSION_CODE }}
          AL_VERSION_NAME: ${{ env.AL_RELEASE_VERSION_NAME }}
          ANDROID_KEYSTORE_PATH: al-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Verify APK signatures
        working-directory: android
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-android-installers
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish branch-signed APK handoff
        if: github.ref == 'refs/heads/codex/al-tdd'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH='signed-builds'
          TARGET_PATH="artifacts/AL-${{ env.AL_RELEASE_VERSION_NAME }}-release.apk"
          if ! gh api "repos/${{ github.repository }}/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha='${{ github.sha }}'
          fi
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/contents/$TARGET_PATH?ref=$BRANCH" --jq '.sha' 2>/dev/null || true)
          base64 -w 0 android/app/build/outputs/apk/release/app-release.apk > /tmp/al-release.b64
          if [ -n "$EXISTING_SHA" ]; then
            jq -n \
              --rawfile content /tmp/al-release.b64 \
              --arg message "Publish AL ${{ env.AL_RELEASE_VERSION_NAME }} signed APK" \
              --arg branch "$BRANCH" \
              --arg sha "$EXISTING_SHA" \
              '{message:$message,content:$content,branch:$branch,sha:$sha}' > /tmp/al-release.json
          else
            jq -n \
              --rawfile content /tmp/al-release.b64 \
              --arg message "Publish AL ${{ env.AL_RELEASE_VERSION_NAME }} signed APK" \
              --arg branch "$BRANCH" \
              '{message:$message,content:$content,branch:$branch}' > /tmp/al-release.json
          fi
          gh api --method PUT "repos/${{ github.repository }}/contents/$TARGET_PATH" --input /tmp/al-release.json

      - name: Publish Android update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ env.AL_RELEASE_VERSION_CODE }}" \
            --title "AL Android ${{ env.AL_RELEASE_VERSION_NAME }}" \
            --notes "AL Android 自动更新版本 ${{ env.AL_RELEASE_VERSION_NAME }}。app-release.apk 为正式包；app-debug.apk 为使用同一固定证书签名的兼容安装包。" \
            --latest \
            "android/app/build/outputs/apk/release/app-release.apk#AL-${{ env.AL_RELEASE_VERSION_NAME }}-release.apk" \
            "android/app/build/outputs/apk/debug/app-debug.apk#AL-${{ env.AL_RELEASE_VERSION_NAME }}-compat.apk"

      - name: Publish automatic update manifest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANIFEST=$(printf '{\n  "latestBuild": %s,\n  "version": "%s",\n  "releaseUrl": "https://github.com/%s/releases/download/android-v%s/app-release.apk"\n}\n' \
            "${{ env.AL_RELEASE_VERSION_CODE }}" \
            "${{ env.AL_RELEASE_VERSION_NAME }}" \
            "${{ github.repository }}" \
            "${{ env.AL_RELEASE_VERSION_CODE }}")
          if ! gh api "repos/${{ github.repository }}/git/ref/heads/update-channel" >/dev/null 2>&1; then
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref='refs/heads/update-channel' \
              -f sha='${{ github.sha }}'
          fi
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/contents/android-update.json?ref=update-channel" --jq '.sha' 2>/dev/null || true)
          CONTENT=$(printf '%s' "$MANIFEST" | base64 -w 0)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/android-update.json" \
              -f message="Update Android channel to ${{ env.AL_RELEASE_VERSION_NAME }}" \
              -f content="$CONTENT" \
              -f branch='update-channel' \
              -f sha="$EXISTING_SHA"
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/android-update.json" \
              -f message="Create Android update channel at ${{ env.AL_RELEASE_VERSION_NAME }}" \
              -f content="$CONTENT" \
              -f branch='update-channel'
          fi
